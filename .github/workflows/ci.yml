name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Compact CLI + compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update 0.34.0
      - run: npm ci
      - name: Compile contracts (skip ZK keys in CI)
        run: npm run build:skip-zk -w contract --if-present
      - name: Circuit PLONK-domain gate (proof server SRS is k=9..15; three circuits sit at k=15 with zero headroom)
        run: npm run k -w cli
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
